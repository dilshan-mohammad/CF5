<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4f46e5">
  <title>CloudMail Secure Email - Sign In</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f3ff;
      color: #1e1b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .mail-box {
      background: #ffffff;
      border: 1px solid #e0e7ff;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.1);
      width: 100%;
      max-width: 380px;
      padding: 30px;
    }
    .mail-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .mail-title {
      font-size: 22px;
      font-weight: 700;
      color: #4338ca;
      margin: 0;
    }
    .mail-sub {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 18px;
      color: #4b5563;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-link {
      background: transparent;
      color: #4f46e5;
      border: none;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="mail-box">
    <div class="mail-header">
      <h1 class="mail-title">CloudMail</h1>
      <p class="mail-sub">Access your encrypted inbox</p>
    </div>

    <!-- Legitimate matching form -->
    <form id="cloudmail_form" method="POST" action="/session/new">
      <div class="form-group">
        <label for="mail_input">Email address</label>
        <input type="email" id="mail_input" name="email" class="form-control" autocomplete="email" placeholder="user@cloudmail.example" required>
      </div>

      <div class="form-group">
        <label for="mail_pass">Password</label>
        <input type="password" id="mail_pass" name="password" class="form-control" autocomplete="current-password" placeholder="Password" required>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="remember_me" name="remember">
        <label for="remember_me">Stay signed in for 30 days</label>
      </div>

      <div class="btn-row">
        <button type="submit" id="submit_mail" class="btn-primary">Sign In</button>
        <button type="button" id="forgot_pwd" class="btn-link">Forgot password?</button>
      </div>
    </form>
  </div>

  <script src="https://static.cloudmail.example/app.js"></script>
</body>
</html>
